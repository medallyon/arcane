name: Branch Preview Images

# Builds and pushes ghcr.io images tagged with the source branch name on every push.
# Sanitizes branch names (e.g. feat/foo -> feat-foo) since / is invalid in a tag.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: arcane
            dockerfile: docker/Dockerfile
          - image: arcane-headless
            dockerfile: docker/Dockerfile-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set branch tag
        id: tag
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
